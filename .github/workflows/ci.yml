name: CI

on:
  pull_request:
  push:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        # Incremental formatting via lint-staged; full-tree check is advisory until debt is cleared.
        continue-on-error: true
        run: pnpm format:check

      - name: Unit & API tests
        run: pnpm test

      - name: Typecheck product
        run: pnpm typecheck

      - name: Typecheck admin
        run: pnpm typecheck:admin

      - name: Build admin
        env:
          SKIP_OPENNEXT_CLOUDFLARE_DEV: "1"
          AUTH_SECRET: "ci-build-placeholder"
        run: pnpm build:admin

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e
        env:
          SKIP_OPENNEXT_CLOUDFLARE_DEV: "1"
          AUTH_SECRET: "ci-e2e-auth-secret"
